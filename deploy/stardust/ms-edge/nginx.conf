# 创空间容器的边缘层：只做一件事——把素材请求 302 到当前源，字节从不经过这个容器。
#
# 为什么 nginx 占 7860 而不是另开端口：创空间把对外端口写死成 7860（deploy_schema.json
# 的 port.const），容器里没有第二个公网口。所以三个进程共用这一个口，按路径分流——这与
# Stardust 的 compose 同构（游戏 3120 / 素材解析器 3130 / 一个 nginx 在前面）。
#
# 这里**不用 Lua**：素材的判定在 edge-sidecar.mjs 里（Stardust 的 openi-resolver 也是这个
# 形状）。少一个动态模块就少一类「配置写错导致 nginx 起不来」，而且那段逻辑能用 node --test
# 直接测。nginx 只做两件事：按路径分流，和 sidecar 挂掉时自己跳主源。

worker_processes auto;
# 非 root（镜像里是 USER node）需要一个可写的 pid 与临时目录
pid /tmp/sp-edge/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/sp-edge/client_body;
    proxy_temp_path /tmp/sp-edge/proxy;
    fastcgi_temp_path /tmp/sp-edge/fastcgi;
    uwsgi_temp_path /tmp/sp-edge/uwsgi;
    scgi_temp_path /tmp/sp-edge/scgi;

    # 构建期由 render-nginx.mjs 从 sources.json 生成：定义 $sp_fallback_base。
    # 为什么生成而不是写死：下面有两个地方要用同一个基址（sidecar 兜底 + 字体重定向），
    # 手写第二份会在换 release pin 时漂移。
    include /app/deploy/stardust/ms-edge/sources-nginx.conf;

    upstream sp_game {
        server 127.0.0.1:3120;
        keepalive 32;
    }
    upstream sp_edge {
        server 127.0.0.1:3130;
        keepalive 16;
    }

    # WebSocket 与普通请求共用一个 server，靠这两个 map 决定 Upgrade 头
    map $http_upgrade $sp_connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;
        server_name _;

        # 素材树：本容器不持有这些字节，交给 sidecar 决定 302 去哪。
        # 注意整棵树都交给它（不在这里再列一遍扩展名白名单）：白名单只存在于 sidecar 一处，
        # 两处列表迟早会不一致。sidecar 对不该跳的路径回 404，与加边缘层之前游戏本体的行为一致。
        location ~ ^/(assets|fonts)/ {
            proxy_pass http://sp_edge;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            # 素材请求不该把凭证带出容器
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            # 上游只回一个 302，不传字节，所以超时给紧一点：卡住的 sidecar 不该拖住玩家
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 7s;
            proxy_redirect off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @sp_asset_fallback;
        }

        # sidecar 起不来或挂了，也不能让玩家吃到错误页：nginx 自己 302 到主源。
        # （这是照 Stardust 的 @ark_proto_asset_fallback —— 他们的素材后端故障也是这么兜的。）
        location @sp_asset_fallback {
            # $uri 是**解码后**的。回显进 Location 之前必须限定字符集，否则等于把未校验的字节
            # 直接写进响应头（%0d%0a 这类就是这个方向的问题）。实测整棵素材树 15,979 个文件
            # 没有一个路径用到 [ ]，所以这里用保守子集即可 —— 它只是 sidecar 缺失时的兜底。
            if ($uri !~ "^/(assets|fonts)/[A-Za-z0-9/._-]+$") {
                return 404;
            }
            return 302 $sp_fallback_base$uri$is_args$args;
        }

        # 其余一切（页面、/data/**、/js/**、/vendor/**、/media/**、/ws、/healthz）都还是游戏本体。
        # /media/** 刻意留给游戏：它自己有 /media/bgm/x → /assets/audio/bgm/x.mp3 的映射，
        # 挪到这边就得复刻那条映射，多一处可能不一致的地方而没有收益。
        location / {
            proxy_pass http://sp_game;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sp_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
